<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selectores 2 - Validador de Formulario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body { background: #eef2f7; font-family: Arial, sans-serif; }
        .contenedor { max-width: 850px; margin: 40px auto; }
        .titulo { background: #dc3545; color: white; padding: 20px; border-radius: 12px 12px 0 0; text-align: center; }
        .card { border-radius: 12px; }
        .error { border: 2px solid #dc3545 !important; background: #fff5f5; }
        .valido { border: 2px solid #198754 !important; }
        .resultado { display: none; margin-top: 20px; }
    </style>
</head>
<body>
<div class="container contenedor">
    <div class="card shadow">
        <div class="titulo">
            <h2>VALIDADOR DE FORMULARIO</h2>
        </div>
        <div class="card-body">
            <form id="formulario" onsubmit="return false;">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label>Nombre completo (*):</label>
                        <input type="text" name="nombre_completo" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>DNI (*):</label>
                        <input type="text" name="dni_numero" class="form-control" maxlength="8" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>Teléfono móvil (9 dígitos):</label>
                        <input type="text" name="tel_movil" class="form-control" maxlength="9">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>Correo (*):</label>
                        <input type="text" name="contacto_mail" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>Fecha de nacimiento (*):</label>
                        <input type="date" name="nacimiento" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>Código generado:</label>
                        <input type="text" name="codigo" class="form-control" value="AUTO-0001" disabled>
                    </div>
                    <div class="col-12 mb-3">
                        <label class="d-block">Intereses (marque al menos 2):</label>
                        <input type="checkbox" name="interes" value="Web"> Web
                        <input type="checkbox" name="interes" value="Redes" class="ms-3"> Redes
                        <input type="checkbox" name="interes" value="Datos" class="ms-3"> Datos
                        <input type="checkbox" name="interes" value="Móvil" class="ms-3"> Móvil
                    </div>
                    <div class="col-12 mb-3">
                        <label class="d-block">Acepta términos (*):</label>
                        <input type="radio" name="terminos" value="si"> Sí
                        <input type="radio" name="terminos" value="no" class="ms-3" checked> No
                    </div>
                </div>
                <div class="text-center">
                    <button id="btnValidar" class="btn btn-danger">Validar formulario</button>
                    <button id="btnLimpiar" class="btn btn-secondary">Limpiar</button>
                </div>
            </form>

            <div id="resultado" class="resultado">
                <div class="alert alert-light border">
                    <h5>Informe de validación</h5>
                    <p><strong>Campos obligatorios [required]:</strong> <span id="rReq"></span></p>
                    <p><strong>Campos de texto [type='text'] habilitados:</strong> <span id="rTexto"></span></p>
                    <p><strong>Campos deshabilitados :disabled:</strong> <span id="rDis"></span></p>
                    <p><strong>Intereses marcados:</strong> <span id="rInt"></span></p>
                    <p><strong>Completitud:</strong> <span id="rPct"></span>%</p>
                    <ul id="rErrores" class="text-danger"></ul>
                    <p id="rFinal" class="fw-bold mb-0"></p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
$(document).ready(function () {

    $("#btnValidar").click(function () {
        let errores = [];
        $("#formulario .form-control").removeClass("error valido");

        // 1) [required]: obligatorios vacíos
        let obligatorios = $("#formulario [required]");
        let llenos = 0;
        obligatorios.each(function () {
            if ($(this).val().trim() === "") {
                $(this).addClass("error");
                errores.push("Falta completar: " + $(this).attr("name"));
            } else {
                $(this).addClass("valido");
                llenos++;
            }
        });

        // 2) [name*='dni']: contiene "dni" -> 8 dígitos
        let dni = $("input[name*='dni']");
        if (dni.val().trim() !== "" && !/^\d{8}$/.test(dni.val().trim())) {
            dni.removeClass("valido").addClass("error");
            errores.push("El DNI debe tener 8 dígitos.");
        }

        // 3) [name^='tel']: empieza con "tel" -> 9 dígitos que inicien en 9 (opcional)
        let tel = $("input[name^='tel']");
        if (tel.val().trim() !== "" && !/^9\d{8}$/.test(tel.val().trim())) {
            tel.addClass("error");
            errores.push("El teléfono debe tener 9 dígitos y empezar con 9.");
        }

        // 4) [name$='mail']: termina con "mail" -> formato de correo
        let mail = $("input[name$='mail']");
        if (mail.val().trim() !== "" && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail.val().trim())) {
            mail.removeClass("valido").addClass("error");
            errores.push("El correo no tiene un formato válido.");
        }

        // 5) :checked sobre checkboxes por nombre
        let intereses = $("input[name='interes']:checked");
        if (intereses.length < 2) errores.push("Marque al menos 2 intereses.");

        // 6) radio :checked
        if ($("input[name='terminos']:checked").val() !== "si") {
            errores.push("Debe aceptar los términos.");
        }

        let pct = (llenos / obligatorios.length) * 100;

        $("#rReq").text(obligatorios.length);
        $("#rTexto").text($("input[type='text']:enabled").length);
        $("#rDis").text($("#formulario :disabled").length);
        $("#rInt").text(intereses.length ? intereses.map(function () { return this.value; }).get().join(", ") : "ninguno");
        $("#rPct").text(pct.toFixed(0));

        $("#rErrores").empty();
        $.each(errores, function (i, e) { $("#rErrores").append("<li>" + e + "</li>"); });

        $("#rFinal").removeClass("text-success text-danger")
            .addClass(errores.length ? "text-danger" : "text-success")
            .text(errores.length ? "Formulario con " + errores.length + " error(es)." : "Formulario válido. ¡Listo para enviar!");

        $("#resultado").slideDown();
    });

    $("#btnLimpiar").click(function () {
        $("#formulario input:enabled").not("[type='radio']").val("").prop("checked", false);
        $("input[name='terminos'][value='no']").prop("checked", true);
        $("#formulario .form-control").removeClass("error valido");
        $("#resultado").slideUp();
    });
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery 1 - Control de Gastos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body { background: #eef2f7; font-family: Arial, sans-serif; }
        .contenedor { max-width: 800px; margin: 40px auto; }
        .titulo { background: #0dcaf0; color: #052c65; padding: 20px; border-radius: 12px 12px 0 0; text-align: center; }
        .card { border-radius: 12px; }
        .item { display: none; }
        .ok { color: #0a7d2c; font-weight: bold; }
        .alerta { color: #b8860b; font-weight: bold; }
        .excedido { color: #dc3545; font-weight: bold; }
    </style>
</head>
<body>
<div class="container contenedor">
    <div class="card shadow">
        <div class="titulo">
            <h2>CONTROL DE GASTOS</h2>
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-12 mb-3">
                    <label>Presupuesto del mes (S/):</label>
                    <input type="number" id="presupuesto" class="form-control" min="0" placeholder="Ejemplo: 1500">
                </div>
                <div class="col-md-5 mb-3">
                    <label>Descripción:</label>
                    <input type="text" id="descripcion" class="form-control">
                </div>
                <div class="col-md-3 mb-3">
                    <label>Monto (S/):</label>
                    <input type="number" id="monto" class="form-control" min="0">
                </div>
                <div class="col-md-4 mb-3">
                    <label>Categoría:</label>
                    <select id="categoria" class="form-select">
                        <option value="">Seleccione</option>
                        <option>Alimentación</option><option>Transporte</option>
                        <option>Estudios</option><option>Ocio</option><option>Otros</option>
                    </select>
                </div>
            </div>
            <div class="text-center mb-3">
                <button id="btnAgregar" class="btn btn-info">Agregar gasto</button>
                <button id="btnVaciar" class="btn btn-secondary">Vaciar todo</button>
            </div>

            <ul id="lista" class="list-group mb-3"></ul>

            <div class="alert alert-info">
                <p><strong>Total gastado:</strong> S/ <span id="total">0.00</span></p>
                <p><strong>Saldo disponible:</strong> S/ <span id="saldo">0.00</span></p>
                <p><strong>Porcentaje usado:</strong> <span id="porcentaje">0</span>%</p>
                <p class="mb-0"><strong>Estado:</strong> <span id="estado">Sin datos</span></p>
            </div>
        </div>
    </div>
</div>

<script>
$(document).ready(function () {

    function recalcular() {
        let presupuesto = parseFloat($("#presupuesto").val()) || 0;
        let total = 0;
        $("#lista li").each(function () {
            total += $(this).data("monto");
        });
        let saldo = presupuesto - total;
        let pct = presupuesto > 0 ? (total / presupuesto) * 100 : 0;

        $("#total").text(total.toFixed(2));
        $("#saldo").text(saldo.toFixed(2));
        $("#porcentaje").text(pct.toFixed(1));

        let clase = "ok", texto = "Gasto saludable";
        if (presupuesto === 0 && total === 0) { clase = ""; texto = "Sin datos"; }
        else if (pct > 100) { clase = "excedido"; texto = "Presupuesto excedido"; }
        else if (pct >= 80) { clase = "alerta"; texto = "Cuidado: cerca del límite"; }

        $("#estado").removeClass("ok alerta excedido").addClass(clase).text(texto);
    }

    $("#btnAgregar").click(function () {
        let desc = $("#descripcion").val().trim();
        let monto = parseFloat($("#monto").val());
        let cat = $("#categoria").val();

        if (!desc || isNaN(monto) || monto <= 0 || !cat) {
            alert("Complete descripción, monto (mayor a 0) y categoría.");
            return;
        }

        let li = $("<li class='list-group-item d-flex justify-content-between align-items-center item'></li>")
            .data("monto", monto)
            .html("<span><b>" + desc + "</b> <small class='text-muted'>(" + cat + ")</small></span>" +
                  "<span>S/ " + monto.toFixed(2) +
                  " <button class='btn btn-sm btn-outline-danger ms-2 eliminar'>X</button></span>");

        $("#lista").append(li);
        li.fadeIn(400);

        $("#descripcion, #monto").val("");
        $("#categoria").val("");
        recalcular();
    });

    // Delegación de eventos: funciona también con elementos creados después
    $("#lista").on("click", ".eliminar", function () {
        $(this).closest("li").fadeOut(300, function () {
            $(this).remove();
            recalcular();
        });
    });

    $("#presupuesto").on("input", recalcular);

    $("#btnVaciar").click(function () {
        $("#lista li").fadeOut(300, function () {
            $(this).remove();
            recalcular();
        });
    });
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery 3 - Conversor en Vivo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body { background: #eef2f7; font-family: Arial, sans-serif; transition: background .3s; }
        body.oscuro { background: #212529; }
        .contenedor { max-width: 900px; margin: 40px auto; }
        .titulo { background: #20c997; color: #053b2c; padding: 20px; border-radius: 12px 12px 0 0; text-align: center; }
        .card { border-radius: 12px; }
        .panel { border: 2px solid #dee2e6; border-radius: 12px; padding: 15px; transition: all .3s; }
        .panel.activo { border-color: #20c997; box-shadow: 0 0 12px rgba(32,201,151,.5); }
        .res { font-size: 1.3rem; font-weight: bold; color: #0a7d2c; }
    </style>
</head>
<body>
<div class="container contenedor">
    <div class="card shadow">
        <div class="titulo">
            <h2>CONVERSOR EN VIVO</h2>
        </div>
        <div class="card-body">
            <div class="text-end mb-3">
                <button id="btnModo" class="btn btn-sm btn-dark">Modo oscuro</button>
            </div>

            <div class="row g-3">
                <!-- Moneda -->
                <div class="col-md-4">
                    <div class="panel" id="panelMoneda">
                        <h5>Soles a moneda</h5>
                        <label>Soles (S/):</label>
                        <input type="number" id="soles" class="form-control mb-2" min="0">
                        <label>Tipo de cambio USD:</label>
                        <input type="number" id="tcUsd" class="form-control mb-2" value="3.75" step="0.01">
                        <label>Tipo de cambio EUR:</label>
                        <input type="number" id="tcEur" class="form-control mb-2" value="4.10" step="0.01">
                        <p class="mb-0">USD: <span id="rUsd" class="res">0.00</span></p>
                        <p class="mb-0">EUR: <span id="rEur" class="res">0.00</span></p>
                    </div>
                </div>

                <!-- Temperatura -->
                <div class="col-md-4">
                    <div class="panel" id="panelTemp">
                        <h5>Temperatura</h5>
                        <label>Grados Celsius:</label>
                        <input type="number" id="celsius" class="form-control mb-2">
                        <p class="mb-0">Fahrenheit: <span id="rF" class="res">0.0</span></p>
                        <p class="mb-0">Kelvin: <span id="rK" class="res">0.0</span></p>
                        <p class="mb-0 mt-2">Sensación: <span id="rSens" class="fw-bold">-</span></p>
                    </div>
                </div>

                <!-- Distancia -->
                <div class="col-md-4">
                    <div class="panel" id="panelDist">
                        <h5>Distancia</h5>
                        <label>Kilómetros:</label>
                        <input type="number" id="km" class="form-control mb-2" min="0">
                        <p class="mb-0">Millas: <span id="rMi" class="res">0.00</span></p>
                        <p class="mb-0">Metros: <span id="rM" class="res">0</span></p>
                        <p class="mb-0 mt-2">Tiempo a 60 km/h: <span id="rTiempo" class="fw-bold">-</span></p>
                    </div>
                </div>
            </div>

            <p class="text-muted small mt-3 mb-0">Los resultados se actualizan mientras escribe. Pase el mouse sobre cada panel.</p>
        </div>
    </div>
</div>

<script>
$(document).ready(function () {

    // Efecto hover sobre los paneles
    $(".panel").hover(
        function () { $(this).addClass("activo"); },
        function () { $(this).removeClass("activo"); }
    );

    // Moneda: se recalcula al escribir en cualquiera de los 3 campos
    $("#soles, #tcUsd, #tcEur").on("input", function () {
        let s = parseFloat($("#soles").val()) || 0;
        let usd = parseFloat($("#tcUsd").val()) || 1;
        let eur = parseFloat($("#tcEur").val()) || 1;
        $("#rUsd").text((s / usd).toFixed(2));
        $("#rEur").text((s / eur).toFixed(2));
    });

    // Temperatura
    $("#celsius").on("input", function () {
        let c = parseFloat($(this).val());
        if (isNaN(c)) { $("#rF, #rK").text("0.0"); $("#rSens").text("-"); return; }
        $("#rF").text((c * 9 / 5 + 32).toFixed(1));
        $("#rK").text((c + 273.15).toFixed(1));

        let sens = c < 10 ? "Frío" : c < 20 ? "Fresco" : c < 28 ? "Agradable" : "Calor";
        let color = c < 10 ? "#0d6efd" : c < 20 ? "#20c997" : c < 28 ? "#fd7e14" : "#dc3545";
        $("#rSens").text(sens).css("color", color);
    });

    // Distancia
    $("#km").on("input", function () {
        let km = parseFloat($(this).val());
        if (isNaN(km)) { $("#rMi").text("0.00"); $("#rM").text("0"); $("#rTiempo").text("-"); return; }
        $("#rMi").text((km * 0.621371).toFixed(2));
        $("#rM").text((km * 1000).toLocaleString());

        let horas = km / 60;
        let h = Math.floor(horas);
        let m = Math.round((horas - h) * 60);
        $("#rTiempo").text(h + " h " + m + " min");
    });

    $("#btnModo").click(function () {
        $("body").toggleClass("oscuro");
        $(this).text($("body").hasClass("oscuro") ? "Modo claro" : "Modo oscuro");
    });
});
</script>
</body>
</html>
